<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRコードメーカー</title>
<link rel="stylesheet" href="style.css?v=20260929-menu3">
<script defer src="vendor/qrcode.js"></script><script defer src="vendor/qrcode_UTF8.js"></script><script defer src="app.js?v=20260929-menu3"></script>
<style>
.workspace > .controls { grid-column: 1; grid-row: 1; }
.workspace > .preview { grid-column: 2; grid-row: 1; }
@media (max-width: 700px) {
  .workspace > .preview { grid-column: 1; grid-row: 1; }
  .workspace > .controls { grid-column: 1; grid-row: 2; }
}
.url-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.url-heading > label { margin: 0; }
.clear-all { min-height: 44px; padding: 8px 0 8px 12px; background: transparent; border: 0; border-radius: 4px; color: #52657b; font-size: 14px; font-weight: 400; line-height: 1.5; text-decoration: underline; text-underline-offset: 3px; }
.clear-all:hover:not(:disabled) { color: #162d48; filter: none; }
</style>
</head>
<body>
<main>
<header><div class="header-top"><span class="brand">QR / MAKER</span>
<select id="language-select" aria-label="表示言語">
<option value="ja" lang="ja">日本語</option>
<option value="en" lang="en">English</option>
<option value="vi" lang="vi">Tiếng Việt</option>
</select></div><h1>QRコードメーカー</h1><p>URLから、タイトル付きのQRコードを。</p></header>
<div class="workspace">
<section class="preview" aria-label="プレビュー">
<div class="preview-label">プレビュー</div>
<div class="paper"><div id="empty"><div class="empty-symbol" aria-hidden="true">＋</div><p>URLを入力して<br>QRコードを生成してください</p></div><canvas id="canvas" hidden aria-label="生成されたQRコード"></canvas></div>
<button id="download" class="download" disabled>PNGをダウンロード</button>
<p id="status" class="status" role="status" aria-live="polite"></p>
</section>
<section class="controls" aria-label="QRコードの設定">
<form id="form" novalidate>
<div class="url-heading">
<label for="url">URL</label>
<button class="clear-all" type="reset" aria-label="URL・タイトル・QRコードをすべてクリア">すべてクリア</button>
</div><input id="url" type="url" placeholder="https://example.com" autocomplete="url" spellcheck="false" aria-describedby="error" required>
<p id="error" class="error" role="alert"></p>
<button class="primary" type="submit">QRコードを生成</button>
<div class="divider"></div>
<label for="title">タイトル <span>任意</span></label><input id="title" type="text" maxlength="120" placeholder="例：授業資料・アンケート">
<fieldset><legend>タイトルの位置</legend><div class="positions"><label><input type="radio" name="position" value="top">上</label><label><input type="radio" name="position" value="bottom" checked>下</label></div></fieldset>
<p class="hint">タイトルもPNG画像に含まれます。</p>
</form>
</section>

</div>
<footer>QRコードはブラウザー内で生成します。入力したURLは外部に送信しません。</footer>
</main>
</body></html>
